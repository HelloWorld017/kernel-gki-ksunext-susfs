name: Release Boot Image

on:
  workflow_dispatch:

permissions:
  contents: read

# Change these pins together when preparing a new boot image.
env:
  GKI_BUILD_ID: "14691759"
  KSUN_COMMIT: "9f1dccda5ee932251a3c2cfe103f28ef579c04c0"
  KSUN_VERSION_TAG: "v3.4.0"
  SUSFS_COMMIT: "60024a4cedd16c83c75cb225d9ae37ba4fd8dbca"
  SUSFS_PATCH: "50_add_susfs_in_gki-android14-6.1.patch"
  DEVICE_ID: "husky"
  BUILD_TAG: "CP1A.260505.005"

jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      gki_build_id: ${{ steps.pins.outputs.gki_build_id }}
      ksun_commit: ${{ steps.pins.outputs.ksun_commit }}
      ksun_version_tag: ${{ steps.pins.outputs.ksun_version_tag }}
      susfs_commit: ${{ steps.pins.outputs.susfs_commit }}
      susfs_patch: ${{ steps.pins.outputs.susfs_patch }}
      device_id: ${{ steps.pins.outputs.device_id }}
      build_tag: ${{ steps.pins.outputs.build_tag }}
    steps:
      # Reusable workflow job inputs cannot read the caller's env directly.
      - name: Export release pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'gki_build_id=%s\n' "${GKI_BUILD_ID}"
            printf 'ksun_commit=%s\n' "${KSUN_COMMIT}"
            printf 'ksun_version_tag=%s\n' "${KSUN_VERSION_TAG}"
            printf 'susfs_commit=%s\n' "${SUSFS_COMMIT}"
            printf 'susfs_patch=%s\n' "${SUSFS_PATCH}"
            printf 'device_id=%s\n' "${DEVICE_ID}"
            printf 'build_tag=%s\n' "${BUILD_TAG}"
          } >> "${GITHUB_OUTPUT}"

  build:
    needs: config
    uses: ./.github/workflows/build.yaml
    with:
      gki_build_id: ${{ needs.config.outputs.gki_build_id }}
      ksun_commit: ${{ needs.config.outputs.ksun_commit }}
      ksun_version_tag: ${{ needs.config.outputs.ksun_version_tag }}
      susfs_commit: ${{ needs.config.outputs.susfs_commit }}
      susfs_patch: ${{ needs.config.outputs.susfs_patch }}

  fetch:
    needs: config
    uses: ./.github/workflows/fetch.yaml
    with:
      device_id: ${{ needs.config.outputs.device_id }}
      build_tag: ${{ needs.config.outputs.build_tag }}

  pack:
    needs: [config, build, fetch]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out packing script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download built kernel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: gki-${{ needs.config.outputs.gki_build_id }}-ksun-susfs
          path: pack/built

      - name: Download stock boot image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: stock-boot
          path: pack/stock

      - name: Pack boot image
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/repack_boot_image.py \
            pack/stock/stock-boot.img \
            pack/built/Image.lz4 \
            pack/boot.img

      - name: Upload packed boot image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packed-boot
          path: pack/boot.img
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [config, pack, fetch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packed boot image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: packed-boot
          path: release

      - name: Download stock boot image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: stock-boot
          path: release/stock

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEVICE_ID: ${{ needs.config.outputs.device_id }}
          BUILD_TAG: ${{ needs.config.outputs.build_tag }}
          GKI_BUILD_ID: ${{ needs.config.outputs.gki_build_id }}
          KSUN_COMMIT: ${{ needs.config.outputs.ksun_commit }}
          SUSFS_COMMIT: ${{ needs.config.outputs.susfs_commit }}
          SUSFS_PATCH: ${{ needs.config.outputs.susfs_patch }}
        run: |
          set -euo pipefail
          mv release/stock/stock-boot.img release/boot.original.img
          RELEASE_TAG="${DEVICE_ID}-${BUILD_TAG}-gki-${GKI_BUILD_ID}-${KSUN_COMMIT:0:8}-${SUSFS_COMMIT:0:8}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release already exists: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Git tag already exists: ${RELEASE_TAG}" >&2
            exit 1
          fi

          gh release create "${RELEASE_TAG}" release/boot.img release/boot.original.img \
            --target "${GITHUB_SHA}" \
            --title "${DEVICE_ID} ${BUILD_TAG} GKI ${GKI_BUILD_ID}" \
            --notes "Device: ${DEVICE_ID}
          Factory build: ${BUILD_TAG}
          GKI build: ${GKI_BUILD_ID}
          KernelSU Next: ${KSUN_COMMIT}
          SUSFS: ${SUSFS_COMMIT}
          SUSFS patch: ${SUSFS_PATCH}"

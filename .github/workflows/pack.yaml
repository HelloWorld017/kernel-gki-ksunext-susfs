name: Pack Boot Image

on:
  workflow_call:
    inputs:
      gki_build_id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download built kernel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: gki-${{ inputs.gki_build_id }}-ksun-susfs
          path: inputs/kernel

      - name: Download stock boot image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: stock-boot
          path: inputs/stock

      - name: Repack boot.img
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pack_boot_image.py \
            --stock inputs/stock/stock-boot.img \
            --kernel inputs/kernel/Image \
            --output boot.img

      - name: Upload completed boot image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packed-boot
          path: boot.img
          if-no-files-found: error
          compression-level: 0
